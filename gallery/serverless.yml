#       Value: "Some output value"

plugins:
  - serverless-domain-manager
  - serverless-offline

custom:
  stage: ${opt:stage, self:provider.stage}
  # One Secrets Manager secret with a webhook URL per stage: {"dev": "https://...", "prod": "https://..."} (shared with the blog service)
  amplifyWebhookSecret: ${env:AMPLIFY_WEBHOOK_URL, 'AMPLIFY_WEBHOOK_URL'}
  # Album text generation (see the Album Text Generation section of the root README). Everything has a default,
  # so a plain deploy works.
  albumText:
    mediaBucket: ${env:S3_MEDIA_BUCKET, 'taleofddh-media'}
    albumTable: ${self:provider.stage}.${env:APP_NAME, 'taleofddh'}.${self:service}.gallery
    draftTable: ${self:provider.stage}.${env:APP_NAME, 'taleofddh'}.${self:service}.albumDraft
    # Inference profile used by the worker, and the foundation model behind it (for the IAM policy).
    modelId: ${env:BEDROCK_MODEL_ID, 'eu.anthropic.claude-sonnet-4-6'}
    foundationModelId: ${env:BEDROCK_FOUNDATION_MODEL_ID, 'anthropic.claude-sonnet-4-6'}
    # One Secrets Manager secret with the names that must never appear in public text, per stage:
    # {"dev": ["..."], "prod": ["..."]} (same pattern as AMPLIFY_WEBHOOK_URL). Created once by hand.
    denyListSecret: ${env:ALBUM_TEXT_DENY_LIST, 'ALBUM_TEXT_DENY_LIST'}
    # Shared SNS topic for generative AI work, one per stage. Created by hand in the console, not in any stack.
    genaiTopic: ${env:GENAI_TOPIC, 'taleofddh-genai'}-${self:provider.stage}
    genaiTopicArn: arn:aws:sns:${aws:region}:${aws:accountId}:${self:custom.albumText.genaiTopic}
    dailyLimit: ${env:ALBUM_TEXT_DAILY_LIMIT, '20'}
  # Cognito user pools that issue the ID tokens checked by the admin endpoints
  userPoolArns:
    dev: ${env:USER_POOL_ARN_DEV, 'arn:aws:cognito-idp:eu-west-1:216439337168:userpool/eu-west-1_Bp47pzJru'}
    prod: ${env:USER_POOL_ARN_PROD, 'arn:aws:cognito-idp:eu-west-1:216439337168:userpool/eu-west-1_EV9nheb0T'}
  domains:
    prod: ${env:API_DOMAIN, 'api.taleofddh.com'}
    dev: ${self:custom.stage}-${env:API_DOMAIN, 'api.taleofddh.com'}
  customDomain:
    domainName: ${self:custom.domains.${self:custom.stage}}
    basePath: ${env:BASE_PATH, 'gallery'}
    stage: ${self:custom.stage}
    certificateName: ${env:CERTIFICATE_NAME, '*.taleofddh.com'}
    hostedZoneId: ${env:HOSTED_ZONE_ID, 'Z044305914KLOWN7PAF5E'}
    createRoute53Record: true
    endpointType: ${env:ENDPOINT_TYPE, 'regional'}
    securityPolicy: ${env:SECURITY_POLICY, 'tls_1_2'}
    apiType: ${env:API_TYPE, 'rest'}
