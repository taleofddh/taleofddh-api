# Welcome to Serverless!
#
# This file is the main config file for your service.
# It's very minimal at this point and uses default values.
# You can always add more config options for more control.
# We've included some commented out config examples here.
# Just uncomment any of them to get that config option.
#
# For full config options, check the docs:
#    docs.serverless.com
#
# Happy Coding!

service: ${env:SERVICE_NAME, 'gallery'}
# app and org for use with dashboard.serverless.com
#app: your-app-name
#org: your-org-name

# You can pin your service to only deploy with a specific Serverless version
# Check out our docs for more details
frameworkVersion: '4'

provider:
  name: aws
  runtime: ${env:RUNTIME, 'nodejs24.x'}
  endpointType: ${env:ENDPOINT_TYPE, 'regional'}
  profile: ${env:APP_NAME, 'taleofddh'}

  # you can overwrite defaults here
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'eu-west-1'}
  environment:
    ENVIRONMENT: ${opt:stage, self:provider.stage}
    REGION: ${opt:region, 'eu-west-1'}
    APP_NAME: ${env:APP_NAME, 'taleofddh'}
    SERVICE_NAME: ${env:SERVICE_NAME, 'gallery'}
    # This service's role -> permissions table (read by @taleofddh/auth requirePermission)
    ROLE_PERMISSIONS_TABLE: ${self:provider.stage}.${env:APP_NAME, 'taleofddh'}.${self:service}.rolePermissions
    S3_MEDIA_BUCKET: ${env:S3_MEDIA_BUCKET, 'taleofddh-media'}
    SIGNER_PRIVATE_KEY: ${env:SIGNER_PRIVATE_KEY, 'SIGNER_PRIVATE_KEY'}
    CLOUDFRONT_PUBLIC_KEY_ID: ${env:CLOUDFRONT_PUBLIC_KEY_ID, 'K3AVJNUCBZPEMY'}
    MEDIA_HOST: ${env:MEDIA_HOST, 'https://media.taleofddh.com'}

  apiGateway:
    shouldStartNameWithService: true

# you can add statements to the Lambda function's IAM Role here
  iamRoleStatements:
    # The role permissions table is read-only for the service (Scan comes from the service table statement below)
    - Effect: "Deny"
      Action:
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:BatchWriteItem
      Resource: arn:aws:dynamodb:*:*:table/${self:provider.stage}.${env:APP_NAME, 'taleofddh'}.${self:service}.rolePermissions
    - Effect: "Allow"
      Action:
        - lambda:InvokeFunction
        - secretsmanager:GetSecretValue
        - kms:Encrypt
        - kms:Decrypt
        - kms:ReEncrypt*
        - kms:GenerateDataKey*
        - kms:DescribeKey
      Resource: "*"
    - Effect: "Allow"
      Action:
        - dynamodb:BatchGetItem
        - dynamodb:GetItem
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:BatchWriteItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
      Resource: arn:aws:dynamodb:*:*:table/${self:provider.stage}.${env:APP_NAME, 'taleofddh'}.${self:service}.*
    # startAlbumText publishes draft requests to the shared genai topic (created by hand, not in this stack).
    - Effect: "Allow"
      Action:
        - sns:Publish
      Resource: ${self:custom.albumText.genaiTopicArn}
    - Effect: "Allow"
      Action:
        - s3:ListBucket
      Resource:
        - arn:aws:s3:::${env:S3_MEDIA_BUCKET, 'taleofddh-media'}
    - Effect: "Allow"
      Action:
        - s3:GetObject
      Resource:
        - arn:aws:s3:::${env:S3_MEDIA_BUCKET, 'taleofddh-media'}/*

# you can define service wide environment variables here
#  environment:
#    variable1: value1

# you can add packaging information here
package:
  individually: true
  patterns:
    - '!test/**'
    - '!resources/**'

functions:
  createOrUpdateAlbum:
    handler: handler.createOrUpdateAlbum
    timeout: 15
    events:
      - http:
          path: createOrUpdateAlbum
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - X-Correlation-ID
          authorizer:
            name: cognitoUserPoolAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${self:custom.userPoolArns.${self:custom.stage}}
            identitySource: method.request.header.Authorization
    environment:
      TABLE_NAME: "gallery"
      AMPLIFY_WEBHOOK_URL: ${self:custom.amplifyWebhookSecret}

  findAlbum:
    handler: handler.findAlbum
    events:
      - http:
          path: album/{name}/{startDateTime}
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - X-Correlation-ID
          authorizer:
            name: cognitoUserPoolAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${self:custom.userPoolArns.${self:custom.stage}}
            identitySource: method.request.header.Authorization
          request:
            parameters:
              paths:
                name: true
                startDateTime: true
    environment:
      TABLE_NAME: "gallery"

  findAlbums:
    handler: handler.findAlbums
    events:
      - http:
          path: albums
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - X-Correlation-ID
          authorizer:
            name: cognitoUserPoolAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${self:custom.userPoolArns.${self:custom.stage}}
            identitySource: method.request.header.Authorization
    environment:
      TABLE_NAME: "gallery"

  updateAlbumViewCount:
    handler: handler.updateAlbumViewCount
    events:
      - http:
          path: albumViewCount
          method: put
          cors: true
          authorizer: aws_iam
    environment:
      TABLE_NAME: "gallery"

  updatePhotoViewCount:
    handler: handler.updatePhotoViewCount
    events:
      - http:
          path: photoViewCount
          method: put
          cors: true
          authorizer: aws_iam
    environment:
      TABLE_NAME: "photo"

  findRecentAlbumNames:
    handler: handler.findRecentAlbumNames
    events:
      - http:
          path: albumRecentNames
          method: get
          cors: true
    environment:
      TABLE_NAME: "gallery"

  findHistoricalAlbumCategories:
    handler: handler.findHistoricalAlbumCategories
    events:
      - http:
          path: albumHistoricalCategories
          method: get
          cors: true
    environment:
      TABLE_NAME: "gallery"

  findAlbumCategories:
    handler: handler.findAlbumCategories
    events:
      - http:
          path: albumCategories
          method: get
          cors: true
    environment:
      TABLE_NAME: "gallery"

  findHistoricalAlbumSubCategories:
    handler: handler.findHistoricalAlbumSubCategories
    events:
      - http:
          path: albumHistoricalSubCategories/{category}
          method: get
          cors: true
          request:
            parameters:
              paths:
                category: true
    environment:
      TABLE_NAME: "gallery"

  findAlbumCategorySubCategories:
    handler: handler.findAlbumCategorySubCategories
    events:
      - http:
          path: albumCategorySubCategories
          method: get
          cors: true
    environment:
      TABLE_NAME: "gallery"

  findHistoricalAlbumCollections:
    handler: handler.findHistoricalAlbumCollections
    events:
      - http:
          path: albumHistoricalCollections/{category}/{subCategory}
          method: get
          cors: true
          request:
            parameters:
              paths:
                category: true
                subCategory: true
    environment:
      TABLE_NAME: "gallery"

  findAlbumCategorySubCategoryCollections:
    handler: handler.findAlbumCategorySubCategoryCollections
    events:
      - http:
          path: albumCategorySubCategoryCollections
          method: get
          cors: true
    environment:
      TABLE_NAME: "gallery"

  findAlbumHistoricalNames:
    handler: handler.findAlbumHistoricalNames
    events:
      - http:
          path: albumHistoricalNames/{category}/{subCategory}/{collection}
          method: get
          cors: true
          request:
            parameters:
              paths:
                category: true
                subCategory: true
                collection: true
    environment:
      TABLE_NAME: "gallery"

  findAlbumCategorySubCategoryCollectionNames:
    handler: handler.findAlbumCategorySubCategoryCollectionNames
    events:
      - http:
          path: albumCategorySubCategoryCollectionNames
          method: get
          cors: true
    environment:
      TABLE_NAME: "gallery"

  findAlbumWithMedia:
    handler: handler.findAlbumWithMedia
    events:
      - http:
          path: albumWithMedia/{category}/{subCategory}/{collection}/{name}
          method: get
          cors: true
          authorizer: aws_iam
          request:
            parameters:
              paths:
                category: true
                subCategory: true
                collection: true
                name: true
    environment:
      TABLE_NAME: "gallery"

  createOrUpdateAlbumLevelMeta:
    handler: handler.createOrUpdateAlbumLevelMeta
    timeout: 15
    events:
      - http:
          path: createOrUpdateAlbumLevelMeta
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - X-Correlation-ID
          authorizer:
            name: cognitoUserPoolAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${self:custom.userPoolArns.${self:custom.stage}}
            identitySource: method.request.header.Authorization
    environment:
      TABLE_NAME: "galleryLevelMeta"
      AMPLIFY_WEBHOOK_URL: ${self:custom.amplifyWebhookSecret}

  findAlbumLevelMeta:
    handler: handler.findAlbumLevelMeta
    events:
      - http:
          path: albumLevelMeta/{level}/{path+}
          method: get
          cors: true
          request:
            parameters:
              paths:
                level: true
                path: true
    environment:
      TABLE_NAME: "galleryLevelMeta"

  findAlbumLevelMetaList:
    handler: handler.findAlbumLevelMetaList
    events:
      - http:
          path: albumLevelMetaList
          method: get
          cors: true
    environment:
      TABLE_NAME: "galleryLevelMeta"

  startAlbumText:
    handler: handler.startAlbumText
    timeout: 20
    events:
      - http:
          path: albumText
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - X-Correlation-ID
          authorizer:
            name: cognitoUserPoolAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${self:custom.userPoolArns.${self:custom.stage}}
            identitySource: method.request.header.Authorization
    environment:
      TABLE_NAME: "gallery"
      GENAI_TOPIC_ARN: ${self:custom.albumText.genaiTopicArn}
      ALBUM_TEXT_DAILY_LIMIT: ${self:custom.albumText.dailyLimit}
  # Album text worker: subscribed to the shared genai topic, only for ALBUM_TEXT messages.
  # Uses its own least-privilege role (AlbumTextWorkerRole under resources: below).
  generateAlbumText:
    handler: handler.generateAlbumText
    role: AlbumTextWorkerRole
    timeout: 300
    memorySize: 2048
    # SNS invokes asynchronously: no retries, so a failed run never pays for a second model call.
    maximumRetryAttempts: 0
    # At most 2 drafts run at once. Throttled events are kept and retried by Lambda for up to 6 hours.
    reservedConcurrency: 2
    events:
      - sns:
          arn: ${self:custom.albumText.genaiTopicArn}
          topicName: ${self:custom.albumText.genaiTopic}
          filterPolicyScope: MessageBody
          filterPolicy:
            template:
              - ALBUM_TEXT
    environment:
      BEDROCK_MODEL_ID: ${self:custom.albumText.modelId}
      DENY_LIST_SECRET: ${self:custom.albumText.denyListSecret}
      MAX_PHOTOS: '12'
      IMAGE_LONG_EDGE: '1024'
      MAX_INPUT_TOKENS: '30000'
      MAX_OUTPUT_TOKENS: '1500'

  findAlbumTextDraft:
    handler: handler.findAlbumTextDraft
    events:
      - http:
          path: albumText/{name}/{startDateTime}
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - X-Correlation-ID
          authorizer:
            name: cognitoUserPoolAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${self:custom.userPoolArns.${self:custom.stage}}
            identitySource: method.request.header.Authorization
          request:
            parameters:
              paths:
                name: true
                startDateTime: true
    environment:
      TABLE_NAME: "gallery"

  findPermissions:
    handler: handler.findPermissions
    events:
      - http:
          path: permissions
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - X-Correlation-ID
          authorizer:
            name: cognitoUserPoolAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${self:custom.userPoolArns.${self:custom.stage}}
            identitySource: method.request.header.Authorization

# you can add CloudFormation resource templates here
resources:
  # API Gateway Errors
  - ${file(resources/api-gateway-errors.yml)}
  # Album text worker role
  - Resources:
      # The worker can read the album table and the album folders, write the draft table, call one model, read the
      # deny list secret and write its logs. It has no access to public/ and cannot write the album
      # table or the bucket. It does not use the service's shared role. The draft tables (<stage>.taleofddh.gallery.albumDraft)
      # were created by hand and are not in this stack.
      AlbumTextWorkerRole:
        Type: AWS::IAM::Role
        Properties:
          RoleName: ${self:service}-${self:provider.stage}-album-text-worker
          AssumeRolePolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Principal:
                  Service: lambda.amazonaws.com
                Action: sts:AssumeRole
          Policies:
            - PolicyName: album-text-worker
              PolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Sid: ListAlbumFolders
                    Effect: Allow
                    Action: s3:ListBucket
                    Resource: arn:aws:s3:::${self:custom.albumText.mediaBucket}
                    Condition:
                      StringLike:
                        s3:prefix:
                          - protected/images/gallery/*
                          - protected/videos/gallery/*
                  - Sid: ReadAlbumPhotos
                    Effect: Allow
                    Action: s3:GetObject
                    Resource: arn:aws:s3:::${self:custom.albumText.mediaBucket}/protected/images/gallery/*
                  - Sid: ReadAlbum
                    Effect: Allow
                    Action: dynamodb:GetItem
                    Resource: arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.albumText.albumTable}
                  - Sid: WriteDraft
                    Effect: Allow
                    Action: dynamodb:UpdateItem
                    Resource: arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.albumText.draftTable}
                  - Sid: InvokeModel
                    Effect: Allow
                    Action: bedrock:InvokeModel
                    Resource:
                      - arn:aws:bedrock:${aws:region}:${aws:accountId}:inference-profile/${self:custom.albumText.modelId}
                      - arn:aws:bedrock:*::foundation-model/${self:custom.albumText.foundationModelId}
                  - Sid: ReadDenyList
                    Effect: Allow
                    Action: secretsmanager:GetSecretValue
                    Resource: arn:aws:secretsmanager:${aws:region}:${aws:accountId}:secret:${self:custom.albumText.denyListSecret}-*
                  - Sid: Logs
                    Effect: Allow
                    Action:
                      - logs:CreateLogStream
                      - logs:PutLogEvents
                    Resource: arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${self:provider.stage}-generateAlbumText:*
