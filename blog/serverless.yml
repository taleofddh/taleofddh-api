# Welcome to Serverless!
#
# This file is the main config file for your service.
# It's very minimal at this point and uses default values.
# You can always add more config options for more control.
# We've included some commented out config examples here.
# Just uncomment any of them to get that config option.
#
# For full config options, check the docs:
#    docs.serverless.com
#
# Happy Coding!

service: ${env:SERVICE_NAME, 'blog'}
# app and org for use with dashboard.serverless.com
#app: your-app-name
#org: your-org-name

# You can pin your service to only deploy with a specific Serverless version
# Check out our docs for more details
frameworkVersion: '4'

provider:
  name: aws
  runtime: ${env:RUNTIME, 'nodejs24.x'}
  endpointType: ${env:ENDPOINT_TYPE, 'regional'}
  profile: ${env:APP_NAME, 'taleofddh'}

  # you can overwrite defaults here
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'eu-west-1'}
  environment:
    ENVIRONMENT: ${opt:stage, self:provider.stage}
    REGION: ${opt:region, 'eu-west-1'}
    APP_NAME: ${env:APP_NAME, 'taleofddh'}
    SERVICE_NAME: ${env:SERVICE_NAME, 'blog'}
    S3_BUCKET: ${env:S3_BUCKET, 'taleofddh-blogs'}
    S3_MEDIA_BUCKET: ${env:S3_MEDIA_BUCKET, 'taleofddh-media'}
    MEDIA_HOST: ${env:MEDIA_HOST, 'https://media.taleofddh.com'}
    # This service's role -> permissions table (read by @taleofddh/auth requirePermission)
    ROLE_PERMISSIONS_TABLE: ${self:provider.stage}.${env:APP_NAME, 'taleofddh'}.${self:service}.rolePermissions

  apiGateway:
    shouldStartNameWithService: true

# you can add statements to the Lambda function's IAM Role here
  iamRoleStatements:
    # The role permissions table is read-only for the service (Scan comes from the service table statement below)
    - Effect: "Deny"
      Action:
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:BatchWriteItem
      Resource: arn:aws:dynamodb:*:*:table/${self:provider.stage}.${env:APP_NAME, 'taleofddh'}.${self:service}.rolePermissions
    - Effect: "Allow"
      Action:
        - lambda:InvokeFunction
        - kms:Encrypt
        - kms:Decrypt
        - kms:ReEncrypt*
        - kms:GenerateDataKey*
        - kms:DescribeKey
      Resource: "*"
    # Amplify webhook URLs: this secret only
    - Effect: "Allow"
      Action:
        - secretsmanager:GetSecretValue
      Resource: arn:aws:secretsmanager:${self:provider.region}:*:secret:${self:custom.amplifyWebhookSecret}-*
    - Effect: "Allow"
      Action:
        - s3:ListBucket
      Resource:
        - arn:aws:s3:::${env:S3_BUCKET, 'taleofddh-blogs'}
        - arn:aws:s3:::${env:S3_MEDIA_BUCKET, 'taleofddh-media'}
    - Effect: "Allow"
      Action:
        - s3:GetObject
      Resource:
        - arn:aws:s3:::${env:S3_BUCKET, 'taleofddh-blogs'}/*
        - arn:aws:s3:::${env:S3_MEDIA_BUCKET, 'taleofddh-media'}/*
    # Blog markdown documents
    - Effect: "Allow"
      Action:
        - s3:PutObject
      Resource: arn:aws:s3:::${env:S3_BUCKET, 'taleofddh-blogs'}/*
    # Title photo upload URLs are presigned for this prefix only
    - Effect: "Allow"
      Action:
        - s3:PutObject
      Resource: arn:aws:s3:::${env:S3_MEDIA_BUCKET, 'taleofddh-media'}/public/images/blogs/*
    - Effect: "Allow"
      Action:
        - dynamodb:BatchGetItem
        - dynamodb:GetItem
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:BatchWriteItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
      Resource: arn:aws:dynamodb:*:*:table/${self:provider.stage}.${env:APP_NAME, 'taleofddh'}.${self:service}.*

# you can define service wide environment variables here
#  environment:
#    variable1: value1

# you can add packaging information here
package:
  individually: true

functions:
  findCategorizedBlogList:
    handler: handler.findCategorizedBlogList
    events:
      - http:
          path: blogListCategorized/{category}/{homePageFlag}
          method: get
          cors: true
          request:
            parameters:
              paths:
                category: true
                homePageFlag: true
    environment:
      TABLE_NAME: "blog"

  updateBlogViewCount:
    handler: handler.updateBlogViewCount
    events:
      - http:
          path: blogViewCount
          method: put
          cors: true
    environment:
      TABLE_NAME: "blog"

  findBlogCommentList:
    handler: handler.findBlogCommentList
    events:
      - http:
          path: blogCommentList/{blogName}
          method: get
          cors: true
          request:
            parameters:
              paths:
                blogName: true
    environment:
      TABLE_NAME: "comment"

  addBlogComment:
    handler: handler.addBlogComment
    events:
      - http:
          path: blogComment
          method: post
          cors: true
    environment:
      TABLE_NAME: "comment"

  getBlogDocument:
    handler: handler.getBlogDocument
    events:
      - http:
          path: blogDocument/{prefix}/{file}
          method: get
          cors: true
          request:
            parameters:
              paths:
                prefix: true
                file: true
    environment:
      S3_BUCKET: ${env:S3_BUCKET, 'taleofddh-blogs'}

  findHistoricalBlogCategories:
    handler: handler.findHistoricalBlogCategories
    events:
      - http:
          path: blogHistoricalCategories
          method: get
          cors: true
    environment:
      TABLE_NAME: "blog"

  findBlogCategories:
    handler: handler.findBlogCategories
    events:
      - http:
          path: blogCategories
          method: get
          cors: true
    environment:
      TABLE_NAME: "blog"

  findHistoricalBlogNames:
    handler: handler.findHistoricalBlogNames
    events:
      - http:
          path: blogHistoricalNames/{category}
          method: get
          cors: true
          request:
            parameters:
              paths:
                category: true
    environment:
      TABLE_NAME: "blog"

  findBlogCategoryNames:
    handler: handler.findBlogCategoryNames
    events:
      - http:
          path: blogCategoryNames
          method: get
          cors: true
    environment:
      TABLE_NAME: "blog"

  findBlog:
    handler: handler.findBlog
    events:
      - http:
          path: blog/{category}/{name}
          method: get
          cors: true
          request:
            parameters:
              paths:
                category: true
                name: true
    environment:
      TABLE_NAME: "blog"

  createOrUpdateBlog:
    handler: handler.createOrUpdateBlog
    timeout: 15
    events:
      - http:
          path: createOrUpdateBlog
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - X-Correlation-ID
          authorizer:
            name: cognitoUserPoolAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${self:custom.userPoolArns.${self:custom.stage}}
            identitySource: method.request.header.Authorization
    environment:
      TABLE_NAME: "blog"
      S3_BUCKET: ${env:S3_BUCKET, 'taleofddh-blogs'}
      AMPLIFY_WEBHOOK_URL: ${self:custom.amplifyWebhookSecret}
  
  blogForEdit:
    handler: handler.blogForEdit
    events:
      - http:
          path: blogForEdit/{category}/{name}
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - X-Correlation-ID
          authorizer:
            name: cognitoUserPoolAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${self:custom.userPoolArns.${self:custom.stage}}
            identitySource: method.request.header.Authorization
          request:
            parameters:
              paths:
                category: true
                name: true
    environment:
      TABLE_NAME: "blog"
      S3_BUCKET: ${env:S3_BUCKET, 'taleofddh-blogs'}
  
  blogTitlePhotoUploadUrl:
    handler: handler.blogTitlePhotoUploadUrl
    events:
      - http:
          path: blogTitlePhotoUploadUrl
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - X-Correlation-ID
          authorizer:
            name: cognitoUserPoolAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${self:custom.userPoolArns.${self:custom.stage}}
            identitySource: method.request.header.Authorization
    environment:
      S3_MEDIA_BUCKET: ${env:S3_MEDIA_BUCKET, 'taleofddh-media'}

  findPermissions:
    handler: handler.findPermissions
    events:
      - http:
          path: permissions
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - X-Correlation-ID
          authorizer:
            name: cognitoUserPoolAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${self:custom.userPoolArns.${self:custom.stage}}
            identitySource: method.request.header.Authorization
# you can add CloudFormation resource templates here
resources:
  # API Gateway Errors
  - ${file(resources/api-gateway-errors.yml)}
#  Resources:
#    NewResource:
#      Type: AWS::S3::Bucket
#      Properties:
#        BucketName: my-new-bucket
#  Outputs:
#     NewOutput:
#       Description: "Description for the output"
#       Value: "Some output value"

plugins:
  - serverless-domain-manager
  - serverless-offline

custom:
  stage: ${opt:stage, self:provider.stage}
  # Cognito user pools that issue the ID tokens checked by the blog management endpoints
  userPoolArns:
    dev: ${env:USER_POOL_ARN_DEV, 'arn:aws:cognito-idp:eu-west-1:216439337168:userpool/eu-west-1_Bp47pzJru'}
    prod: ${env:USER_POOL_ARN_PROD, 'arn:aws:cognito-idp:eu-west-1:216439337168:userpool/eu-west-1_EV9nheb0T'}
  # One Secrets Manager secret with a webhook URL per stage: {"dev": "https://...", "prod": "https://..."}
  amplifyWebhookSecret: ${env:AMPLIFY_WEBHOOK_URL, 'AMPLIFY_WEBHOOK_URL'}
  domains:
    prod: ${env:API_DOMAIN, 'api.taleofddh.com'}
    dev: ${self:custom.stage}-${env:API_DOMAIN, 'api.taleofddh.com'}
  customDomain:
    domainName: ${self:custom.domains.${self:custom.stage}}
    basePath: ${env:BASE_PATH, 'blog'}
    stage: ${self:custom.stage}
    certificateName: ${env:CERTIFICATE_NAME, '*.taleofddh.com'}
    hostedZoneId: ${env:HOSTED_ZONE_ID, 'Z044305914KLOWN7PAF5E'}
    createRoute53Record: true
    endpointType: ${env:ENDPOINT_TYPE, 'regional'}
    securityPolicy: ${env:SECURITY_POLICY, 'tls_1_2'}
    apiType: ${env:API_TYPE, 'rest'}
